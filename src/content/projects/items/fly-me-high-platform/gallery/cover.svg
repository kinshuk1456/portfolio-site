<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Fly Me High: spreadsheet workflows replaced by a Spring Boot and PostgreSQL internal platform">
  <rect width="1200" height="675" fill="#f4f1e8"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#17150f" stroke-opacity="0.14"/>
  <text x="64" y="84" fill="#17150f" fill-opacity="0.55" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3">FLY ME HIGH — INTERNAL OPERATIONS PLATFORM</text>
  <text x="62" y="146" fill="#17150f" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="500">From spreadsheets to a real system.</text>

  <!-- before -->
  <g transform="translate(64,214)" font-family="ui-sans-serif, system-ui" fill="#17150f">
    <text x="0" y="20" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#17150f" fill-opacity="0.55">BEFORE</text>
    <g transform="translate(0,36)" stroke="#17150f" stroke-opacity="0.2">
      <rect width="360" height="230" fill="#eae4d6"/>
      <line x1="0" y1="46" x2="360" y2="46"/><line x1="0" y1="92" x2="360" y2="92"/>
      <line x1="0" y1="138" x2="360" y2="138"/><line x1="0" y1="184" x2="360" y2="184"/>
      <line x1="120" y1="0" x2="120" y2="230"/><line x1="240" y1="0" x2="240" y2="230"/>
    </g>
    <text x="14" y="78" font-size="15" fill-opacity="0.7">manual records,</text>
    <text x="14" y="100" font-size="15" fill-opacity="0.7">handoffs, re-entry</text>
  </g>

  <text x="452" y="346" font-size="34" fill="#c1440e">→</text>

  <!-- after: stack -->
  <g transform="translate(516,214)" font-family="ui-sans-serif, system-ui" fill="#17150f">
    <text x="0" y="20" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#17150f" fill-opacity="0.55">AFTER</text>
    <g transform="translate(0,36)">
      <rect width="620" height="66" fill="#fbfaf5" stroke="#17150f" stroke-opacity="0.2"/>
      <text x="20" y="42" font-size="20" font-weight="600">Frontend — coordinated interns</text>
      <rect y="82" width="620" height="66" fill="#f7ece6" stroke="#c1440e" stroke-opacity="0.5"/>
      <text x="20" y="124" font-size="20" font-weight="600">REST APIs — Spring Boot</text>
      <rect y="164" width="620" height="66" fill="#17150f"/>
      <text x="20" y="206" font-size="20" font-weight="600" fill="#f4f1e8">PostgreSQL — one source of truth</text>
    </g>
  </g>

  <line x1="64" y1="512" x2="1136" y2="512" stroke="#17150f" stroke-opacity="0.25"/>
  <text x="64" y="556" fill="#17150f" fill-opacity="0.7" font-family="Georgia, serif" font-style="italic" font-size="23">~30 min less per record · adoption 3 → 6–7 users · ~25% faster backend after API debugging.</text>
  <text x="64" y="598" fill="#17150f" fill-opacity="0.42" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">EXPLANATORY DIAGRAM · NOT A PRODUCT SCREENSHOT</text>
</svg>
