<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Architecture: the browser posts to a Cloudflare Pages Function that holds the key and grounds a Gemini call in a hand-written context, streaming an answer back with a graceful fallback">
  <rect width="1200" height="675" fill="#f4f1e8"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#17150f" stroke-opacity="0.14"/>
  <text x="64" y="82" fill="#17150f" fill-opacity="0.55" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3">ARCHITECTURE</text>
  <text x="62" y="140" fill="#17150f" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="500">Small surface, controlled edges</text>

  <g font-family="ui-sans-serif, system-ui" fill="#17150f">
    <!-- browser -->
    <g transform="translate(64,220)">
      <rect width="220" height="140" fill="#eae4d6" stroke="#17150f" stroke-opacity="0.2"/>
      <text x="18" y="32" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#17150f" fill-opacity="0.55">BROWSER</text>
      <text x="18" y="68" font-size="19" font-weight="600">Chat on</text>
      <text x="18" y="92" font-size="19" font-weight="600">Contact page</text>
      <text x="18" y="122" font-size="13" fill-opacity="0.6">no key here</text>
    </g>
    <text x="296" y="292" font-size="24" fill="#c1440e">→</text>

    <!-- function -->
    <g transform="translate(332,200)">
      <rect width="300" height="180" fill="#17150f"/>
      <text x="18" y="32" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#f4f1e8" fill-opacity="0.6">CLOUDFLARE FUNCTION</text>
      <text x="18" y="66" font-size="19" font-weight="600" fill="#f4f1e8">POST /api/chat</text>
      <text x="18" y="96" font-size="14" fill="#f4f1e8" fill-opacity="0.7">holds GEMINI_API_KEY</text>
      <text x="18" y="122" font-size="14" fill="#f4f1e8" fill-opacity="0.7">+ grounding context</text>
      <text x="18" y="148" font-size="14" fill="#f4f1e8" fill-opacity="0.7">+ no-fabrication rules</text>
    </g>
    <text x="644" y="292" font-size="24" fill="#c1440e">→</text>

    <!-- gemini -->
    <g transform="translate(680,220)">
      <rect width="220" height="140" fill="#f7ece6" stroke="#c1440e" stroke-opacity="0.5"/>
      <text x="18" y="32" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#17150f" fill-opacity="0.55">MODEL</text>
      <text x="18" y="68" font-size="19" font-weight="600">Gemini</text>
      <text x="18" y="92" font-size="14" fill-opacity="0.6">free tier</text>
      <text x="18" y="120" font-size="13" fill-opacity="0.6">streamed back (SSE)</text>
    </g>

    <!-- fallback -->
    <g transform="translate(936,220)">
      <rect width="200" height="140" fill="#eae4d6" stroke="#17150f" stroke-opacity="0.2"/>
      <text x="18" y="32" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#c1440e">IF UNREACHABLE</text>
      <text x="18" y="68" font-size="18" font-weight="600">Grounded</text>
      <text x="18" y="92" font-size="18" font-weight="600">demo reply</text>
      <text x="18" y="122" font-size="13" fill-opacity="0.6">page never breaks</text>
    </g>
  </g>

  <line x1="64" y1="430" x2="1136" y2="430" stroke="#17150f" stroke-opacity="0.25"/>
  <text x="64" y="476" fill="#17150f" fill-opacity="0.7" font-family="Georgia, serif" font-style="italic" font-size="23">Deliberately not RAG, a vector DB, or an agent — a curated context is more accurate for a surface this small.</text>
  <text x="64" y="520" fill="#17150f" fill-opacity="0.42" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">EXPLANATORY DIAGRAM · NOT A PRODUCT SCREENSHOT</text>
</svg>
