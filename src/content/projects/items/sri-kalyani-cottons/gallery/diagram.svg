<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Process diagram: a customer quality specification matched against inventory organized by quality parameters, producing a matching lot or a workable alternative">
  <rect width="1200" height="675" fill="#f4f1e8"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#17150f" stroke-opacity="0.14"/>
  <text x="64" y="82" fill="#17150f" fill-opacity="0.55" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3">MATCHING PROCESS</text>
  <text x="62" y="140" fill="#17150f" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="500">From "not available" to a match</text>

  <g font-family="ui-sans-serif, system-ui" fill="#17150f">
    <g transform="translate(64,220)">
      <rect width="250" height="150" fill="#eae4d6" stroke="#17150f" stroke-opacity="0.2"/>
      <text x="18" y="32" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#17150f" fill-opacity="0.55">CUSTOMER NEED</text>
      <text x="18" y="70" font-size="19" font-weight="600">Quality spec</text>
      <text x="18" y="98" font-size="14" fill-opacity="0.6">staple · micronaire ·</text>
      <text x="18" y="120" font-size="14" fill-opacity="0.6">strength · trash · moisture</text>
    </g>
    <text x="330" y="302" font-size="26" fill="#c1440e">→</text>

    <g transform="translate(374,220)">
      <rect width="250" height="150" fill="#17150f"/>
      <text x="18" y="32" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#f4f1e8" fill-opacity="0.6">INVENTORY</text>
      <text x="18" y="70" font-size="19" font-weight="600" fill="#f4f1e8">Organized by</text>
      <text x="18" y="94" font-size="19" font-weight="600" fill="#f4f1e8">quality</text>
      <text x="18" y="126" font-size="14" fill="#f4f1e8" fill-opacity="0.65">lots comparable on spec</text>
    </g>
    <text x="640" y="302" font-size="26" fill="#c1440e">→</text>

    <g transform="translate(684,180)">
      <rect width="452" height="100" fill="#fbfaf5" stroke="#17150f" stroke-opacity="0.22"/>
      <text x="20" y="40" font-size="19" font-weight="600">Matching lot</text>
      <text x="20" y="70" font-size="14" fill-opacity="0.6">fits the customer's spec directly</text>
      <rect y="120" width="452" height="100" fill="#f7ece6" stroke="#c1440e" stroke-opacity="0.5"/>
      <text x="20" y="160" font-size="19" font-weight="600">Workable alternative</text>
      <text x="20" y="190" font-size="14" fill-opacity="0.65">close enough to discuss — not a dead end</text>
    </g>
  </g>

  <g transform="translate(64,430)" font-family="ui-sans-serif, system-ui" fill="#17150f">
    <rect width="1072" height="72" fill="#eae4d6" stroke="#17150f" stroke-opacity="0.2"/>
    <text x="20" y="30" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#c1440e">IN PARALLEL — PRODUCTION</text>
    <text x="20" y="55" font-size="17">Workflow analysis → bottlenecks identified → process changes → part of ~25% higher throughput</text>
  </g>

  <line x1="64" y1="548" x2="1136" y2="548" stroke="#17150f" stroke-opacity="0.25"/>
  <text x="64" y="592" fill="#17150f" fill-opacity="0.7" font-family="Georgia, serif" font-style="italic" font-size="23">The best solution starts with understanding the customer and the operating system around the problem.</text>
</svg>
