<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Vizor: a natural-language request is planned by an agent and applied to a real Tableau workbook by a deterministic compiler, with validation and a versioned output">
  <rect width="1200" height="675" fill="#f4f1e8"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#17150f" stroke-opacity="0.14"/>
  <text x="64" y="84" fill="#17150f" fill-opacity="0.55" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3">VIZOR — AI DASHBOARD OPTIMIZATION FOR TABLEAU</text>
  <text x="62" y="146" fill="#17150f" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="500">Describe the change. Apply it safely.</text>

  <!-- request -->
  <g transform="translate(64,214)">
    <rect width="300" height="120" fill="#eae4d6" stroke="#17150f" stroke-opacity="0.2"/>
    <text x="18" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#17150f" fill-opacity="0.55">REQUEST · NATURAL LANGUAGE</text>
    <text x="18" y="74" font-family="Georgia, serif" font-size="22" fill="#17150f">"add West-region</text>
    <text x="18" y="102" font-family="Georgia, serif" font-size="22" fill="#17150f">revenue as a KPI"</text>
  </g>
  <text x="382" y="282" font-size="30" fill="#c1440e">→</text>

  <!-- agent proposes -->
  <g transform="translate(430,214)">
    <rect width="300" height="120" fill="#fbfaf5" stroke="#17150f" stroke-opacity="0.22"/>
    <text x="18" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#c1440e">AGENT</text>
    <text x="18" y="72" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="600" fill="#17150f">Proposes a neutral spec</text>
    <text x="18" y="100" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#17150f" fill-opacity="0.6">add · replace · move — never edits XML</text>
  </g>
  <text x="748" y="282" font-size="30" fill="#c1440e">→</text>

  <!-- deterministic compiler -->
  <g transform="translate(796,214)">
    <rect width="340" height="120" fill="#17150f"/>
    <text x="18" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#f4f1e8" fill-opacity="0.6">DETERMINISTIC COMPILER</text>
    <text x="18" y="72" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="600" fill="#f4f1e8">Applies + validates</text>
    <text x="18" y="100" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f4f1e8" fill-opacity="0.7">schema · field · zone · fidelity</text>
  </g>

  <!-- output -->
  <g transform="translate(64,392)">
    <rect width="1072" height="70" fill="#f7ece6" stroke="#c1440e" stroke-opacity="0.5"/>
    <text x="20" y="30" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#c1440e">OUTPUT</text>
    <text x="20" y="54" font-family="ui-sans-serif, system-ui" font-size="17" fill="#17150f">Versioned, hash-verified, reopenable Tableau workbook — or it fails closed and ships nothing.</text>
  </g>

  <line x1="64" y1="512" x2="1136" y2="512" stroke="#17150f" stroke-opacity="0.25"/>
  <text x="64" y="558" fill="#17150f" fill-opacity="0.7" font-family="Georgia, serif" font-style="italic" font-size="24">The model plans the change; deterministic code ships the workbook only when validation passes. Windows private beta.</text>
  <text x="64" y="602" fill="#17150f" fill-opacity="0.42" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">EXPLANATORY DIAGRAM · NOT A PRODUCT SCREENSHOT</text>
</svg>
