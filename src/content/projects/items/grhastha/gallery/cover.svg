<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Grhastha: three pillars for guided home puja — Know When, Know How, Know the Words — in a calm almanac style with a lotus motif">
  <rect width="1200" height="675" fill="#f4f1e8"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#17150f" stroke-opacity="0.14"/>
  <rect x="40" y="40" width="1120" height="595" fill="none" stroke="#c1440e" stroke-opacity="0.35"/>

  <text x="600" y="108" text-anchor="middle" fill="#17150f" fill-opacity="0.55" font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="4">GRHASTHA · GUIDED PUJA AT HOME</text>

  <!-- lotus / diya motif (stylized, symmetric) -->
  <g transform="translate(600,210)" fill="none" stroke="#c1440e" stroke-width="2.5" stroke-opacity="0.8">
    <path d="M0,40 C0,4 0,4 0,-24"/>
    <path d="M0,40 C-30,20 -44,-4 -40,-34 C-16,-22 -4,4 0,40"/>
    <path d="M0,40 C30,20 44,-4 40,-34 C16,-22 4,4 0,40"/>
    <path d="M0,40 C-52,26 -78,-2 -76,-30 C-44,-24 -14,6 0,40"/>
    <path d="M0,40 C52,26 78,-2 76,-30 C44,-24 14,6 0,40"/>
  </g>
  <circle cx="600" cy="196" r="6" fill="#c1440e"/>

  <text x="600" y="300" text-anchor="middle" fill="#17150f" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="500">Do it properly — with calm.</text>

  <!-- three pillars -->
  <g font-family="ui-sans-serif, system-ui" fill="#17150f">
    <g transform="translate(120,360)">
      <rect width="290" height="170" fill="#fbfaf5" stroke="#17150f" stroke-opacity="0.2"/>
      <text x="24" y="48" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#c1440e">KNOW WHEN</text>
      <text x="24" y="92" font-size="22" font-weight="600">Timing &amp; muhurta</text>
      <text x="24" y="124" font-size="15" fill-opacity="0.6">location-aware,</text>
      <text x="24" y="146" font-size="15" fill-opacity="0.6">right for where you are</text>
    </g>
    <g transform="translate(455,360)">
      <rect width="290" height="170" fill="#fbfaf5" stroke="#17150f" stroke-opacity="0.2"/>
      <text x="24" y="48" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#c1440e">KNOW HOW</text>
      <text x="24" y="92" font-size="22" font-weight="600">Step by step</text>
      <text x="24" y="124" font-size="15" fill-opacity="0.6">preparation, materials,</text>
      <text x="24" y="146" font-size="15" fill-opacity="0.6">and workable substitutes</text>
    </g>
    <g transform="translate(790,360)">
      <rect width="290" height="170" fill="#17150f"/>
      <text x="24" y="48" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2" fill="#f4f1e8" fill-opacity="0.7">KNOW THE WORDS</text>
      <text x="24" y="92" font-size="22" font-weight="600" fill="#f4f1e8">Mantras, understood</text>
      <text x="24" y="124" font-size="15" fill="#f4f1e8" fill-opacity="0.65">Sanskrit · audio ·</text>
      <text x="24" y="146" font-size="15" fill="#f4f1e8" fill-opacity="0.65">transliteration · meaning</text>
    </g>
  </g>

  <text x="600" y="590" text-anchor="middle" fill="#17150f" fill-opacity="0.7" font-family="Georgia, serif" font-style="italic" font-size="22">No login. No subscription. Authentic, not gamified.</text>
</svg>
