<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Summit Operations Platform: QR check-in feeding a live occupancy board across 18 sessions">
  <rect width="1200" height="675" fill="#f4f1e8"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#17150f" stroke-opacity="0.14"/>
  <text x="64" y="84" fill="#17150f" fill-opacity="0.55" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3">SUMMIT OPERATIONS PLATFORM</text>
  <text x="62" y="146" fill="#17150f" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="500">Run a live event from one screen.</text>

  <!-- QR check-in -->
  <g transform="translate(64,214)">
    <rect width="240" height="248" fill="#eae4d6" stroke="#17150f" stroke-opacity="0.2"/>
    <text x="18" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#17150f" fill-opacity="0.55">CHECK IN</text>
    <g transform="translate(78,58)" fill="#17150f">
      <rect width="26" height="26"/><rect x="36" width="26" height="26"/><rect x="72" width="26" height="26"/>
      <rect y="36" width="26" height="26"/><rect x="72" y="36" width="26" height="26"/>
      <rect y="72" width="26" height="26"/><rect x="36" y="72" width="26" height="26"/><rect x="72" y="72" width="26" height="26"/>
    </g>
    <text x="120" y="200" font-family="ui-sans-serif, system-ui" font-size="16" text-anchor="middle" fill="#17150f">QR + UCR email</text>
    <text x="120" y="224" font-family="ui-sans-serif, system-ui" font-size="13" text-anchor="middle" fill="#17150f" fill-opacity="0.6">validated at the door</text>
  </g>
  <text x="322" y="346" font-size="30" fill="#c1440e">→</text>

  <!-- occupancy board -->
  <g transform="translate(372,214)" font-family="ui-sans-serif, system-ui" fill="#17150f">
    <rect width="764" height="248" fill="#fbfaf5" stroke="#17150f" stroke-opacity="0.22"/>
    <text x="24" y="40" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#17150f" fill-opacity="0.55">LIVE OCCUPANCY · 18 SESSIONS</text>

    <g transform="translate(24,60)">
      <text x="0" y="18" font-size="15">Session A</text>
      <rect x="150" y="4" width="540" height="18" fill="#eae4d6"/>
      <rect x="150" y="4" width="486" height="18" fill="#17150f"/>
      <text x="700" y="18" font-size="13" text-anchor="end" fill="#17150f" fill-opacity="0.7">90%</text>
    </g>
    <g transform="translate(24,96)">
      <text x="0" y="18" font-size="15">Session B</text>
      <rect x="150" y="4" width="540" height="18" fill="#eae4d6"/>
      <rect x="150" y="4" width="540" height="18" fill="#c1440e"/>
      <text x="700" y="18" font-size="13" text-anchor="end" fill="#c1440e">FULL — reassign</text>
    </g>
    <g transform="translate(24,132)">
      <text x="0" y="18" font-size="15">Session C</text>
      <rect x="150" y="4" width="540" height="18" fill="#eae4d6"/>
      <rect x="150" y="4" width="270" height="18" fill="#17150f"/>
      <text x="700" y="18" font-size="13" text-anchor="end" fill="#17150f" fill-opacity="0.7">50%</text>
    </g>
    <g transform="translate(24,168)">
      <text x="0" y="18" font-size="15">Session D</text>
      <rect x="150" y="4" width="540" height="18" fill="#eae4d6"/>
      <rect x="150" y="4" width="378" height="18" fill="#17150f"/>
      <text x="700" y="18" font-size="13" text-anchor="end" fill="#17150f" fill-opacity="0.7">70%</text>
    </g>
    <text x="24" y="228" font-size="14" fill="#17150f" fill-opacity="0.6">Floor Host checks in · Admin watches capacity, gets alerts, reassigns</text>
  </g>

  <line x1="64" y1="512" x2="1136" y2="512" stroke="#17150f" stroke-opacity="0.25"/>
  <text x="64" y="558" fill="#17150f" fill-opacity="0.7" font-family="Georgia, serif" font-style="italic" font-size="24">120+ check-ins across 18 sessions — built on Streamlit + Google Sheets against a fixed event date.</text>
  <text x="64" y="602" fill="#17150f" fill-opacity="0.42" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">EXPLANATORY DIAGRAM · NOT A PRODUCT SCREENSHOT</text>
</svg>
