<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Check-in workflow: attendee scans a QR code, UCR email is validated, the check-in is written to Google Sheets, and Floor Host and Admin views show live occupancy with alerts and reassignment">
  <rect width="1200" height="675" fill="#f4f1e8"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#17150f" stroke-opacity="0.14"/>
  <text x="64" y="86" fill="#17150f" fill-opacity="0.55" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3">CHECK-IN WORKFLOW</text>
  <text x="62" y="146" fill="#17150f" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="500">One source of truth: Google Sheets</text>

  <g font-family="ui-sans-serif, system-ui" fill="#17150f">
    <!-- QR -->
    <g transform="translate(64,240)">
      <rect width="210" height="170" fill="#eae4d6" stroke="#17150f" stroke-opacity="0.2"/>
      <g transform="translate(66,40)" fill="#17150f">
        <rect width="22" height="22"/><rect x="30" width="22" height="22"/><rect x="60" width="22" height="22"/>
        <rect y="30" width="22" height="22"/><rect x="60" y="30" width="22" height="22"/>
        <rect y="60" width="22" height="22"/><rect x="30" y="60" width="22" height="22"/><rect x="60" y="60" width="22" height="22"/>
      </g>
      <text x="105" y="150" font-size="18" font-weight="600" text-anchor="middle">Scan QR</text>
    </g>
    <text x="292" y="332" font-size="28" fill="#c1440e">→</text>

    <!-- validate -->
    <g transform="translate(336,240)">
      <rect width="210" height="170" fill="#eae4d6" stroke="#17150f" stroke-opacity="0.2"/>
      <text x="105" y="80" font-size="18" font-weight="600" text-anchor="middle">Validate</text>
      <text x="105" y="108" font-size="14" fill-opacity="0.6" text-anchor="middle">UCR email</text>
      <text x="105" y="128" font-size="14" fill-opacity="0.6" text-anchor="middle">roster stays clean</text>
    </g>
    <text x="564" y="332" font-size="28" fill="#c1440e">→</text>

    <!-- sheets -->
    <g transform="translate(608,240)">
      <rect width="210" height="170" fill="#17150f"/>
      <text x="105" y="76" font-size="18" font-weight="600" fill="#f4f1e8" text-anchor="middle">Write to</text>
      <text x="105" y="102" font-size="18" font-weight="600" fill="#f4f1e8" text-anchor="middle">Google Sheets</text>
      <text x="105" y="132" font-size="13" fill="#f4f1e8" fill-opacity="0.7" text-anchor="middle">shared source of truth</text>
    </g>
    <text x="836" y="332" font-size="28" fill="#c1440e">→</text>

    <!-- two views -->
    <g transform="translate(880,240)">
      <rect width="256" height="80" fill="#fbfaf5" stroke="#17150f" stroke-opacity="0.22"/>
      <text x="16" y="34" font-size="16" font-weight="600">Floor Host</text>
      <text x="16" y="58" font-size="13" fill-opacity="0.6">check people in fast</text>
      <rect y="90" width="256" height="80" fill="#f7ece6" stroke="#c1440e" stroke-opacity="0.5"/>
      <text x="16" y="124" font-size="16" font-weight="600">Admin</text>
      <text x="16" y="148" font-size="13" fill-opacity="0.6">occupancy · alerts · reassign</text>
    </g>
  </g>

  <line x1="64" y1="486" x2="1136" y2="486" stroke="#17150f" stroke-opacity="0.25"/>
  <text x="64" y="532" fill="#17150f" fill-opacity="0.7" font-family="Georgia, serif" font-style="italic" font-size="24">Organizers already trusted Sheets — making it the backend meant no new database and an obvious fallback.</text>
  <text x="64" y="580" fill="#17150f" fill-opacity="0.42" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">EXPLANATORY DIAGRAM · NOT A PRODUCT SCREENSHOT</text>
</svg>
